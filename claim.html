<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 25%, #17251a 0%, #0d1410 50%, #050705 100%);
    color: #e8e8e8;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    touch-action: manipulation;
  }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    height: 100%; max-width: 480px; margin: 0 auto; padding: 8px;
    justify-content: center;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 4px 6px 8px;
  }
  .topbar h1 { font-family: 'Orbitron', 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 800; margin: 0; letter-spacing: 2px; color: #7fe0a0; text-shadow: 0 0 12px rgba(127,224,160,0.55); cursor: pointer; }
  .topbar h1:active { color: #a8f0c4; }
  .stats { display: flex; gap: 8px; font-size: 12px; }
  .stat { position: relative; background: #17201a; border-radius: 8px; padding: 4px 8px; min-width: 50px; text-align: center; }
  .stat span { display: block; font-size: 14px; font-weight: 700; color: #fff; }
  .main {
    display: flex; width: 100%; flex: 1 1 auto; min-height: 0;
    align-items: center; justify-content: center; overflow: hidden;
  }
  #board-wrap {
    position: relative; background: #0a0f0b; border-radius: 10px;
    padding: 4px; border: 2px solid #35452f; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(127,224,160,0.08), 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  canvas#board { display: block; border-radius: 6px; border: 1px solid #263420; transition: filter 0.4s ease; }
  #overlay {
    position: absolute; inset: 0; background: rgba(9,12,10,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; gap: 8px; text-align: center; padding: 14px;
    opacity: 1; transform: scale(1);
    transition: opacity 0.35s ease, transform 0.35s ease;
    overflow-y: auto;
  }
  #overlay.hidden { opacity: 0; transform: scale(0.96); pointer-events: none; }
  #deathFlash {
    position: absolute; inset: 0; border-radius: 8px;
    background: #fff; opacity: 0; pointer-events: none; z-index: 60;
  }
  @keyframes deathFlashAnim {
    0% { opacity: 0.8; }
    100% { opacity: 0; }
  }
  #deathFlash.active { animation: deathFlashAnim 0.45s ease-out; }
  #board-wrap.dimming canvas#board { filter: brightness(0.35) saturate(0.6); }
  #overlay h2 { margin: 0; font-family: 'Orbitron', 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 800; letter-spacing: 1px; color: #7fe0a0; text-shadow: 0 0 14px rgba(127,224,160,0.5); }
  #overlay p { margin: 0; font-size: 12px; color: #bbb; max-width: 260px; white-space: pre-line; line-height: 1.45; }
  #overlayText.hidden { display: none; }
  button.primary {
    background: #2f8f5c; color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 15px; font-weight: 600; margin-top: 4px;
  }
  button.primary:active { background: #24714a; }
  .controls {
    width: 100%; display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px; margin-top: 8px; flex: 0 0 auto;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .btn {
    background: #17201a; border: 1px solid #2c3a27; border-radius: 12px;
    color: #e8e8e8; font-size: var(--btn-font, 24px); height: var(--btn-h, 52px); display: flex;
    align-items: center; justify-content: center;
  }
  .btn:active { background: #24312b; }
  .btn.up { grid-column: 2; grid-row: 1; }
  .btn.left { grid-column: 1; grid-row: 2; }
  .btn.down { grid-column: 2; grid-row: 2; }
  .btn.right { grid-column: 3; grid-row: 2; }
  .btn.pausecell {
    grid-column: 1; grid-row: 1; font-size: 16px; color: #888;
    position: relative; overflow: hidden;
    transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease, font-size 0.25s ease;
  }
  #pauseGlyph { position: relative; z-index: 2; display: block; }
  .cashFill {
    position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
    pointer-events: none; z-index: 1;
  }
  .cashFill::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--fill, 0%); background: rgba(47,143,92,0.55);
    transition: height 0.25s ease;
  }
  /* Auszahlung bereit: der Knopf soll den Blick ziehen - grosser Geldsack,
     goldener Rahmen, atmender Schein. Der Rest der Leiste bleibt ruhig. */
  .btn.pausecell.cashReady {
    color: #ffd23f; border-color: #ffd23f;
    background: linear-gradient(165deg, #3d3113 0%, #241c09 100%);
    font-size: calc(var(--btn-font, 24px) * 1.1);
    animation: cashPulse 2.6s linear infinite;
    z-index: 3;
  }
  .btn.pausecell.cashReady #pauseGlyph {
    animation: coinBob 2.6s linear infinite;
    filter: drop-shadow(0 0 7px rgba(255,210,63,0.9));
  }
  .btn.pausecell.cashReady .cashFill::after { background: rgba(255,210,63,0.42); }

  // Alle freien Zellen muessen vom Start aus erreichbar bleiben, sonst sind 100% unmoeglich.
  function layoutIsReachable() {
    const seen = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    const stack = [[0, Math.floor(COLS / 2)]];
    seen[0][Math.floor(COLS / 2)] = true;
    let reached = 0, free = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!isObstacle(grid[r][c])) free++;
    while (stack.length) {
      const [r, c] = stack.pop();
      reached++;
      for (const [nr, nc] of [[r+1,c],[r-1,c],[r,c+1],[r,c-1]]) {
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        if (seen[nr][nc] || isObstacle(grid[nr][nc])) continue;
        seen[nr][nc] = true;
        stack.push([nr, nc]);
      }
    }
    return reached === free;
  }

  function placeObstacles(lv) {
    bonusCells = [];
    bonusClaimed = false;
    movingBlocks = [];
    const plan = obstaclePlan(lv);
    if (!plan.pillars && !plan.pits && !plan.bonus) return;

    for (let attempt = 0; attempt < 40; attempt++) {
      initGrid();
      const taken = [];
      // Spiegelsymmetrisch setzen, das liest sich als Level-Design statt als Rauschen.
      const put = (r, c, val) => {
        if (r < 2 || r > ROWS - 3 || c < 1 || c > COLS - 2) return;
        if (grid[r][c] !== EMPTY) return;
        if (Math.abs(r - 1) + Math.abs(c - Math.floor(COLS / 2)) < 3) return; // Startbereich frei
        grid[r][c] = val;
        taken.push([r, c]);
      };
      let placed = 0;
      let guard = 0;
      while (placed < plan.pillars && guard++ < 200) {
        const r = 2 + Math.floor(Math.random() * (ROWS - 5));
        const c = 1 + Math.floor(Math.random() * (COLS - 2));
        const before = taken.length;
        put(r, c, BLOCK);
        put(r, COLS - 1 - c, BLOCK);
        placed += taken.length - before;
      }
      let pitsPlaced = 0;
      guard = 0;
      while (pitsPlaced < plan.pits && guard++ < 200) {
        const r = 3 + Math.floor(Math.random() * (ROWS - 7));
        const c = 1 + Math.floor(Math.random() * (COLS - 2));
        const before = taken.length;
        put(r, c, PIT);
        put(ROWS - 1 - r, c, PIT);
        pitsPlaced += taken.length - before;
      }

      if (plan.bonus) {
        let ok = false;
        for (let t = 0; t < 60 && !ok; t++) {
          const size = lv >= 6 ? 3 : 2;
          const r0 = Math.floor(ROWS * 0.45) + Math.floor(Math.random() * (Math.floor(ROWS * 0.45) - size));
          const c0 = 1 + Math.floor(Math.random() * (COLS - 2 - size));
          let clear = true;
          for (let r = r0; r < r0 + size; r++)
            for (let c = c0; c < c0 + size; c++)
              if (r >= ROWS - 1 || c >= COLS - 1 || grid[r][c] !== EMPTY) clear = false;
          if (!clear) continue;
          for (let r = r0; r < r0 + size; r++)
            for (let c = c0; c < c0 + size; c++) bonusCells.push({ r, c });
          ok = true;
        }
      }

      if (layoutIsReachable()) {
        // Ab Level 4 wandert ein Teil der Saeulen.
        const movers = lv >= 4 ? Math.min(4, 1 + Math.floor((lv - 4) / 3)) : 0;
        const blockCells = taken.filter(([r, c]) => grid[r][c] === BLOCK);
        for (let i = 0; i < movers && blockCells.length; i++) {
          const idx = Math.floor(Math.random() * blockCells.length);
          const [r, c] = blockCells.splice(idx, 1)[0];
          const horizontal = Math.random() < 0.5;
          movingBlocks.push({
            r, c, prevR: r, prevC: c,
            dr: horizontal ? 0 : (Math.random() < 0.5 ? 1 : -1),
            dc: horizontal ? (Math.random() < 0.5 ? 1 : -1) : 0,
            timer: Math.random() * MOVING_BLOCK_INTERVAL
          });
        }
        return;
      }
      bonusCells = [];
      movingBlocks = [];
    }
    // Kein gueltiges Layout gefunden: lieber ein leeres Feld als ein unloesbares.
    initGrid();
    bonusCells = [];
    movingBlocks = [];
  }

  // Hellt eine Hex-Farbe auf (amount > 0) oder dunkelt sie ab (amount < 0).
  function shadeColor(hex, amount) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amount >= 0) {
      r = Math.round(r + (255 - r) * amount);
      g = Math.round(g + (255 - g) * amount);
      b = Math.round(b + (255 - b) * amount);
    } else {
      const f = 1 + amount;
      r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function shortestAngleDelta(from, to) {
    let d = to - from;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  // Zeitkonstante tau in ms: kleiner = schnapptiger. Frameratenunabhaengig.
  function normAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function easeAngle(cur, target, dtMs, tau) {
    return normAngle(cur + shortestAngleDelta(cur, target) * (1 - Math.exp(-dtMs / tau)));
  }
  function easeValue(cur, target, dtMs, tau) {
    return cur + (target - cur) * (1 - Math.exp(-dtMs / tau));
  }

  function enemyFacing(e) {
    if (e.dc0 === 0 && e.dr0 === 0) return 0;
    return Math.atan2(e.dr0, e.dc0);
  }

  // Saeulen blockieren die Sicht, Gruben nicht.
  function hasLineOfSight(e) {
    let x = e.c, y = e.r;
    const dx = px - e.c, dy = py - e.r;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    if (steps === 0) return true;
    for (let i = 1; i <= steps; i++) {
      const cx = Math.round(e.c + (dx * i) / steps);
      const cy = Math.round(e.r + (dy * i) / steps);
      if (cx === px && cy === py) return true;
      if (!inBounds(cx, cy)) return false;
      if (grid[cy][cx] === BLOCK) return false;
    }
    return true;
  }

  function visionRange(e) {
    const v = VISION[e.personality] || VISION.wanderer;
    return Math.max(3, v.range - (perks ? perks.stealth : 0));
  }

  function canSeePlayer(e) {
    if (performance.now() < smokeUntil) return false; // Rauchbombe: fuer alle unsichtbar
    const v = VISION[e.personality] || VISION.wanderer;
    const dx = px - e.c, dy = py - e.r;
    const dist = Math.hypot(dx, dy);
    if (dist > visionRange(e)) return false;
    if (dist < 1.2) return true; // direkt daneben wird man immer bemerkt
    const facing = (e.angleDisp !== undefined) ? e.angleDisp : enemyFacing(e);
    let diff = Math.atan2(dy, dx) - facing;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    if (Math.abs(diff) > v.half) return false;
    return hasLineOfSight(e);
  }

  // --- Sound ---
  let audioCtx = null;
  let musicGain = null, sfxGain = null;
  let musicMuted = false;
  let padOsc1 = null, padOsc2 = null, padFilter = null, padGain = null;
  let subOsc = null, subGain = null;
  let shimmerOsc = null, shimmerGain = null, shimmerLFO = null, shimmerLFOGain = null;
  let iceOsc = null, iceGain = null;
  let noiseBuffer = null;
  let menuNextStepTime = 0, menuStepIndex = 0;
  let smoothedTension = 0;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        musicGain = audioCtx.createGain();
        musicGain.gain.value = musicMuted ? 0 : 1;
        musicGain.connect(audioCtx.destination);
        sfxGain = audioCtx.createGain();
        sfxGain.gain.value = 1;
        sfxGain.connect(audioCtx.destination);

        // Atmosphaerische Dauer-Drone: Pad + Sub-Bass, laufend per Gain/Filter moduliert
        padFilter = audioCtx.createBiquadFilter();
        padFilter.type = 'lowpass';
        padFilter.Q.value = 1.1;
        padFilter.frequency.value = 400;
        padGain = audioCtx.createGain();
        padGain.gain.value = 0.0001;
        padFilter.connect(padGain);
        padGain.connect(musicGain);

        padOsc1 = audioCtx.createOscillator();
        padOsc1.type = 'sawtooth';
        padOsc1.frequency.value = 87.3;
        padOsc1.connect(padFilter);
        padOsc1.start();

        padOsc2 = audioCtx.createOscillator();
        padOsc2.type = 'sawtooth';
        padOsc2.frequency.value = 87.3 * Math.pow(2, 7/12);
        padOsc2.detune.value = 7;
        padOsc2.connect(padFilter);
        padOsc2.start();

        subOsc = audioCtx.createOscillator();
        subOsc.type = 'sine';
        subOsc.frequency.value = 43.65;
        subGain = audioCtx.createGain();
        subGain.gain.value = 0.0001;
        subOsc.connect(subGain);
        subGain.connect(musicGain);
        subOsc.start();

        // Schild-Schimmer: hohe Sinuswelle mit Tremolo, aktiv waehrend Schild
        shimmerOsc = audioCtx.createOscillator();
        shimmerOsc.type = 'sine';
        shimmerOsc.frequency.value = 87.3 * 4;
        shimmerGain = audioCtx.createGain();
        shimmerGain.gain.value = 0.0001;
        shimmerOsc.connect(shimmerGain);
        shimmerGain.connect(musicGain);
        shimmerOsc.start();

        shimmerLFO = audioCtx.createOscillator();
        shimmerLFO.type = 'sine';
        shimmerLFO.frequency.value = 5.5;
        shimmerLFOGain = audioCtx.createGain();
        shimmerLFOGain.gain.value = 0.0001;
        shimmerLFO.connect(shimmerLFOGain);
        shimmerLFOGain.connect(shimmerGain.gain);
        shimmerLFO.start();

        // Eis-Glitzer: sehr hohe, leise Sinuswelle, aktiv waehrend Waechter eingefroren
        iceOsc = audioCtx.createOscillator();
        iceOsc.type = 'sine';
        iceOsc.frequency.value = 87.3 * 8;
        iceGain = audioCtx.createGain();
        iceGain.gain.value = 0.0001;
        iceOsc.connect(iceGain);
        iceGain.connect(musicGain);
        iceOsc.start();

        // Noise-Buffer fuer 80er-Drum-Machine (Snare/Hihat)
        const bufLen = audioCtx.sampleRate * 1;
        noiseBuffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

        menuNextStepTime = audioCtx.currentTime + 0.1;
        menuStepIndex = 0;
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!audioLoopStarted) {
      audioLoopStarted = true;
      requestAnimationFrame(audioLoop);
    }
  }

  let audioLoopStarted = false;
  function audioLoop(t) {
    updateAmbient(performance.now());
    updateMenuTheme();
    requestAnimationFrame(audioLoop);
  }

  function setMusicMuted(muted) {
    musicMuted = muted;
    if (audioCtx && musicGain) {
      musicGain.gain.setValueAtTime(muted ? 0 : 1, audioCtx.currentTime);
    }
    const btn = document.getElementById('musicBtn');
    if (btn) btn.textContent = muted ? '🔇' : '🔊';
  }

  function tone(freq, dur, type, vol, delay, glideTo, channel) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t0 + dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol != null ? vol : 0.14, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(channel === 'music' ? (musicGain || audioCtx.destination) : (sfxGain || audioCtx.destination));
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  function playNoise(dur, filterFreq, filterType, vol, delay, channel) {
    if (!audioCtx || !noiseBuffer) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const filt = audioCtx.createBiquadFilter();
    filt.type = filterType || 'highpass';
    filt.frequency.value = filterFreq;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(filt); filt.connect(gain);
    gain.connect(channel === 'music' ? (musicGain || audioCtx.destination) : (sfxGain || audioCtx.destination));
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  // --- 80er-Jahre Drum Machine (Start-Screen-Theme) ---
  function drum808Kick(delay) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t0);
    osc.frequency.exponentialRampToValueAtTime(48, t0 + 0.14);
    gain.gain.setValueAtTime(0.22, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
    osc.connect(gain);
    gain.connect(musicGain || audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.24);
  }
  function drum808Snare(delay) {
    playNoise(0.14, 1700, 'bandpass', 0.16, delay, 'music');
    tone(190, 0.1, 'triangle', 0.08, delay, 140, 'music');
  }

  // --- Synth-Stimmen fuer das Start-Theme ---
  function musicOut() { return musicGain || audioCtx.destination; }

  // Saettigungskurve fuer den Kick. Ein reiner Sinus bei 40 Hz ist auf Handy- und
  // Laptoplautsprechern praktisch unhoerbar - erst die Obertoene, die hier entstehen,
  // machen den Ton dort als Bass wahrnehmbar. Die Kurve ist leicht asymmetrisch:
  // die negative Halbwelle wird haerter beschnitten, das erzeugt zusaetzlich
  // geradzahlige Obertoene und damit den Biss. Einmal gebaut und gecacht.
  let kickCurve = null;
  function kickSaturation() {
    if (kickCurve) return kickCurve;
    const n = 2048, drive = 8.5;
    kickCurve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      const d = x < 0 ? drive * 1.35 : drive;
      kickCurve[i] = Math.tanh(x * d) / Math.tanh(d);
    }
    return kickCurve;
  }

  // Techno-Kick aus vier Schichten: Koerper mit sehr schnellem Tonhoehensturz fuer den
  // Schlag, ein liegender Sub darunter fuer den Druck, ein kurzer Knock im Mittenbereich
  // fuer den Biss und ein Klick obendrauf. Alles durch die Saettigung und danach durch
  // einen kurzen Kompressor - der faengt die Spitzen ab, damit die Kette hart gefahren
  // werden kann, ohne dass das Signal clippt.
  function technoKick(delay) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);

    const shaper = audioCtx.createWaveShaper();
    shaper.curve = kickSaturation();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 6;
    comp.ratio.value = 8;
    comp.attack.value = 0.002;
    comp.release.value = 0.12;
    const out = audioCtx.createGain();
    out.gain.value = 0.62;
    shaper.connect(comp); comp.connect(out); out.connect(musicOut());

    // Koerper: 260 Hz faellt in 25 ms auf 55 Hz (der Schlag), danach traeger weiter
    // auf 38 Hz (das Nachsacken). Je schneller der erste Sturz, desto haerter der Anschlag.
    const body = audioCtx.createOscillator();
    body.type = 'sine';
    body.frequency.setValueAtTime(260, t0);
    body.frequency.exponentialRampToValueAtTime(55, t0 + 0.025);
    body.frequency.exponentialRampToValueAtTime(38, t0 + 0.26);
    const bodyGain = audioCtx.createGain();
    bodyGain.gain.setValueAtTime(0.62, t0);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
    body.connect(bodyGain); bodyGain.connect(shaper);
    body.start(t0); body.stop(t0 + 0.44);

    // Sub: fester Ton unter dem Koerper, kurz verzoegert eingeblendet, damit er den
    // Anschlag nicht verwaschen laesst. Er traegt das Fundament.
    const sub = audioCtx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(40, t0);
    const subGainNode = audioCtx.createGain();
    subGainNode.gain.setValueAtTime(0.0001, t0);
    subGainNode.gain.exponentialRampToValueAtTime(0.46, t0 + 0.012);
    subGainNode.gain.exponentialRampToValueAtTime(0.001, t0 + 0.36);
    sub.connect(subGainNode); subGainNode.connect(shaper);
    sub.start(t0); sub.stop(t0 + 0.38);

    // Knock: kurzer Rechteckimpuls in den Mitten. Das ist der Anteil, den man als
    // Haerte hoert - er verschwindet nach 55 ms wieder komplett.
    const knock = audioCtx.createOscillator();
    knock.type = 'square';
    knock.frequency.setValueAtTime(190, t0);
    knock.frequency.exponentialRampToValueAtTime(90, t0 + 0.05);
    const knockFilt = audioCtx.createBiquadFilter();
    knockFilt.type = 'bandpass';
    knockFilt.frequency.value = 320;
    knockFilt.Q.value = 1.4;
    const knockGain = audioCtx.createGain();
    knockGain.gain.setValueAtTime(0.40, t0);
    knockGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.055);
    knock.connect(knockFilt); knockFilt.connect(knockGain); knockGain.connect(shaper);
    knock.start(t0); knock.stop(t0 + 0.07);

    // Klick: zwei Rauschstoesse - einer hoch fuer die Spitze, einer in den oberen
    // Mitten fuer den Schlag des Schlegels.
    playNoise(0.008, 4200, 'highpass', 0.06, delay, 'music');
    playNoise(0.022, 1800, 'bandpass', 0.05, delay, 'music');
  }

  // Hats fuer das Offbeat - heller und kuerzer als die 808-Hats.
  function technoHat(delay, open, vol) {
    playNoise(open ? 0.12 : 0.032, open ? 7000 : 9500, 'highpass', vol, delay, 'music');
  }

  // 808-Clap: drei schnelle Rauschstoesse plus Fahne, traegt Zwei und Vier.
  function clap808(delay, vol) {
    const d = delay || 0;
    for (let i = 0; i < 3; i++) playNoise(0.018, 1600, 'bandpass', vol, d + i * 0.011, 'music');
    playNoise(0.15, 1400, 'bandpass', vol * 0.55, d + 0.03, 'music');
  }

  // TB-303-Bass: Saegezahn durch resonanten Tiefpass mit eigener Huellkurve.
  // glideFrom laesst die Note hineinrutschen - das typische Acid-Schlenzen.
  function acidBass(freq, dur, delay, cutoff, vol, glideFrom) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    if (glideFrom) {
      osc.frequency.setValueAtTime(glideFrom, t0);
      osc.frequency.exponentialRampToValueAtTime(freq, t0 + Math.min(0.08, dur * 0.6));
    } else {
      osc.frequency.setValueAtTime(freq, t0);
    }
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.Q.value = 10;
    filt.frequency.setValueAtTime(Math.max(120, cutoff), t0);
    filt.frequency.exponentialRampToValueAtTime(Math.max(110, freq * 2.2), t0 + dur * 0.85);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(filt); filt.connect(g); g.connect(musicOut());
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  // Verstimmte Doppelsaege durch resonanten Tiefpass - der typische 80er-Polysynth.
  function polyVoice(freq, dur, delay, cutoff, vol, detuneCents) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.Q.value = 6;
    filt.frequency.setValueAtTime(Math.max(200, cutoff), t0);
    filt.frequency.exponentialRampToValueAtTime(Math.max(180, cutoff * 0.45), t0 + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const d = detuneCents === undefined ? 9 : detuneCents;
    for (const cents of [-d, d]) {
      const o = audioCtx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(freq, t0);
      o.detune.setValueAtTime(cents, t0);
      o.connect(filt);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    filt.connect(g); g.connect(musicOut());
  }

  // DX7-Glocke: Sinus-Traeger, dessen Frequenz von einem zweiten Sinus moduliert wird.
  function fmBell(freq, dur, delay, vol) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const car = audioCtx.createOscillator();
    car.type = 'sine'; car.frequency.setValueAtTime(freq, t0);
    const mod = audioCtx.createOscillator();
    mod.type = 'sine'; mod.frequency.setValueAtTime(freq * 3.5, t0);
    const modGain = audioCtx.createGain();
    modGain.gain.setValueAtTime(freq * 2.4, t0);
    modGain.gain.exponentialRampToValueAtTime(1, t0 + dur * 0.5);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    mod.connect(modGain); modGain.connect(car.frequency);
    car.connect(g); g.connect(musicOut());
    mod.start(t0); mod.stop(t0 + dur + 0.02);
    car.start(t0); car.stop(t0 + dur + 0.02);
  }

  // Anschwellende Rauschfahne als Uebergang am Zyklusende.
  function riser(dur, delay, vol) {
    if (!audioCtx || !noiseBuffer) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer; src.loop = true;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass'; filt.Q.value = 2;
    filt.frequency.setValueAtTime(400, t0);
    filt.frequency.exponentialRampToValueAtTime(6000, t0 + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.85);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt); filt.connect(g); g.connect(musicOut());
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  function resetMenuThemeTiming() {
    if (!audioCtx) return;
    menuNextStepTime = audioCtx.currentTime + 0.1;
    menuStepIndex = 0;
  }

  // --- Start-Theme: hypnotischer Techno mit 80er-Instrumentierung ---
  // Sechzehntel-Raster, 16-Takt-Zyklus. Die Harmonie wechselt nur alle vier Takte -
  // die Entwicklung kommt aus der langsamen Filterfahrt, nicht aus den Noten.
  // Das Raster ist bewusst starr: kein Swing, keine Humanisierung.
  const MENU_CHORDS = [
    { root:  0, tones: [0, 3, 7, 10] },  // Am7
    { root:  0, tones: [0, 3, 7, 10] },  // Am7
    { root: -4, tones: [0, 4, 7, 11] },  // Fmaj7
    { root: -2, tones: [0, 4, 7, 10] }   // G7
  ];
  // Arpeggio-Figur ueber die Akkordtoene - laeuft durchgehend und traegt den Sog.
  const MENU_ARP = [0, 1, 2, 3, 4, 3, 2, 1, 0, 2, 4, 5, 4, 2, 1, 0];
  const MENU_BASS_STEPS = [0, 3, 6, 8, 11, 14];

  function updateMenuTheme() {
    if (!audioCtx || menuNextStepTime === 0) return;
    if (hasStarted) { menuNextStepTime = 0; return; }
    const bpm = 126;
    const stepDur = 60 / bpm / 4;
    const root = 220; // A

    while (audioCtx.currentTime >= menuNextStepTime) {
      const step = menuStepIndex % 16;
      const bar = Math.floor(menuStepIndex / 16);
      const cycleBar = bar % 16;
      const chord = MENU_CHORDS[Math.floor(cycleBar / 4) % MENU_CHORDS.length];
      const chordRoot = root * Math.pow(2, chord.root / 12);

      // Filterfahrt ueber den ganzen Zyklus: oeffnet und schliesst einmal in 16 Takten.
      const cyclePos = (cycleBar + step / 16) / 16;
      const sweep = 0.5 - 0.5 * Math.cos(cyclePos * Math.PI * 2);
      const arpCutoff = 420 + sweep * 3400;
      const bassCutoff = 260 + sweep * 900;

      // Arrangement: die Schichten kommen gestaffelt dazu, der letzte Takt bricht auf.
      const breakBar = cycleBar === 15;
      const arpOn = cycleBar >= 2;
      const padOn = cycleBar >= 4;
      const clapOn = cycleBar >= 4 && !breakBar;
      const bellOn = cycleBar >= 8;
      const dropped = breakBar && step >= 8;

      if (step % 4 === 0 && !dropped) technoKick(0);
      if (step % 4 === 2) technoHat(0, true, 0.05);
      else if (step % 2 === 0) technoHat(0, false, 0.03);
      else if (cycleBar >= 6 && (step === 7 || step === 15)) technoHat(0, false, 0.016);
      if (clapOn && (step === 4 || step === 12)) clap808(0, 0.075);

      // Rollender Bass; auf den Oktavspruengen rutscht die Note hinein.
      if (MENU_BASS_STEPS.indexOf(step) !== -1 && !dropped) {
        const up = (step === 6 || step === 14);
        const f = chordRoot / 2 * (up ? 2 : 1);
        acidBass(f, stepDur * 1.6, 0, bassCutoff, 0.085, up ? chordRoot / 2 : 0);
      }

      // Arpeggio in Sechzehnteln - der hypnotische Kern des Stuecks.
      if (arpOn) {
        const t = chord.tones;
        const scale = [t[0], t[1], t[2], t[3], t[0] + 12, t[1] + 12];
        const semis = scale[MENU_ARP[step] % scale.length];
        polyVoice(chordRoot * Math.pow(2, semis / 12), stepDur * 1.5, 0,
                  arpCutoff, 0.036, 11);
      }

      // Pad: ein liegender Akkord pro Takt, breit verstimmt.
      if (padOn && step === 0) {
        for (const semis of chord.tones) {
          polyVoice(chordRoot * Math.pow(2, semis / 12) / 2, stepDur * 15,
                    0, 700 + sweep * 900, 0.022, 14);
        }
      }

      // Glocken-Akzente in der zweiten Zyklushaelfte.
      if (bellOn && (step === 6 || (cycleBar % 4 === 3 && step === 14))) {
        fmBell(chordRoot * 4, 0.9, 0, 0.035);
      }

  function nearestEnemyDist() {
    if (!enemies.length) return 99;

    for (const e of enemies) {

  function computeTension(now) {
    let t = 0;
    const dist = nearestEnemyDist();
    t += Math.max(0, 1 - dist / 9) * 0.5;
    if (trail.length > 0) t += 0.15;
    if (enemies.some(e => e.personality === 'hunter' && (Math.abs(e.c - px) + Math.abs(e.r - py)) <= 6)) t += 0.25;
    if (lives === 1) t += 0.15;
    if (capturedPct >= 65) t += 0.1;
    if (now < shieldUntil || now < freezeUntil) t -= 0.15;
    return Math.max(0, Math.min(1, t));
  }

  function updateAmbient(now) {
    if (!audioCtx || !padGain || !subGain || !padFilter || !padOsc2) return;
    const active = running && !paused && !gameOver;
    const speedActive = active && now < speedUntil;
    const shieldActive = active && now < shieldUntil;
    const iceActive = active && now < freezeUntil;

    const target = active ? computeTension(now) : 0;
    smoothedTension += (target - smoothedTension) * 0.04;

    // Grund-Pad: dunkler/traeger bei Eis, heller bei Speed
    let cutoff = 320 + smoothedTension * 2300 + ((level || 1) - 1) * 40;
    let detune = 6 + smoothedTension * 22;
    let padVol = active ? (0.016 + smoothedTension * 0.05) : 0.0001;
    let subVol = active ? (0.012 + smoothedTension * 0.06) : 0.0001;

    if (speedActive) { cutoff += 900; padVol *= 1.25; }
    if (iceActive) { cutoff *= 0.4; detune *= 0.25; subVol *= 0.6; }

    padGain.gain.setTargetAtTime(padVol, audioCtx.currentTime, 0.25);
    subGain.gain.setTargetAtTime(subVol, audioCtx.currentTime, 0.3);
    padFilter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.2);
    padOsc2.detune.setTargetAtTime(detune, audioCtx.currentTime, 0.2);

    // Schild: schimmernder Tremolo-Ton
    if (shimmerGain && shimmerLFOGain) {
      shimmerGain.gain.setTargetAtTime(shieldActive ? 0.03 : 0.0001, audioCtx.currentTime, 0.2);
      shimmerLFOGain.gain.setTargetAtTime(shieldActive ? 0.022 : 0.0001, audioCtx.currentTime, 0.2);
    }

    // Eis: hohes Glitzern waehrend Waechter eingefroren
    if (iceGain) {
      iceGain.gain.setTargetAtTime(iceActive ? 0.012 : 0.0001, audioCtx.currentTime, 0.15);
    }
  }

  function musicFreq(semitoneIdx, octaveShift) {
    const n = MUSIC_SCALE[semitoneIdx % MUSIC_SCALE.length] + (octaveShift || 0) * 12;

  function updateMusicScheduler() {
    if (!audioCtx || musicNextNoteTime === 0) return;
    const now = performance.now();
    let bpm = Math.min(150, 92 + (level - 1) * 6);
    if (now < speedUntil) bpm *= 1.55;
    if (now < freezeUntil) bpm *= 0.5;
    const stepDur = 60 / bpm / 2;

    while (audioCtx.currentTime >= musicNextNoteTime) {
      const dist = nearestEnemyDist();
      const danger = Math.max(0, Math.min(1, 1 - dist / 9));
      const isTrailing = trail.length > 0;
      const frozen = performance.now() < freezeUntil;
      const step = musicStepIndex % 8;
      const levelOffset = Math.floor((level - 1) / 2);

      if (step === 0 || step === 4) {
        tone(musicFreq(0 + levelOffset, -1), stepDur * 1.7, 'triangle', 0.05 + danger * 0.03, 0, undefined, 'music');
      }
      if (step % 2 === 0) {
        const idx = (step / 2 + levelOffset) % MUSIC_SCALE.length;
        tone(musicFreq(idx, 0), stepDur * 0.9, 'sine', 0.045 + danger * 0.035, 0, undefined, 'music');
      }
      if (!frozen && danger > 0.4 && (step === 2 || step === 6)) {
        tone(musicFreq((step + levelOffset) % MUSIC_SCALE.length, 1), stepDur * 0.5, 'square', 0.03 + danger * 0.04, 0, undefined, 'music');
      }
      if (isTrailing && step % 2 === 1) {
        tone(musicFreq((step + 3 + levelOffset) % MUSIC_SCALE.length, 1), stepDur * 0.4, 'triangle', 0.025, 0, undefined, 'music');
      }

      musicNextNoteTime += stepDur;
      musicStepIndex++;

    // 1. Versuch: zufaellig mit Mindestabstand zum Spieler
    do {
      r = 1 + Math.floor(Math.random() * (ROWS - 2));
      c = 1 + Math.floor(Math.random() * (COLS - 2));
      tries++;

      tries < 300 &&

    );

    // 2. Versuch: zufaellig, Mindestabstand egal, nur freies Feld noetig
    if (grid[r][c] !== EMPTY) {
      tries = 0;
      do {
        r = 1 + Math.floor(Math.random() * (ROWS - 2));
        c = 1 + Math.floor(Math.random() * (COLS - 2));
        tries++;
      } while (tries < 150 && grid[r][c] !== EMPTY);
    }

    // 3. Versuch: komplettes Feld systematisch nach einer freien Zelle absuchen
    if (grid[r][c] !== EMPTY) {
      let found = false;
      for (let rr = 1; rr < ROWS - 1 && !found; rr++) {
        for (let cc = 1; cc < COLS - 1 && !found; cc++) {
          if (grid[rr][cc] === EMPTY) { r = rr; c = cc; found = true; }

    prevPx = px; prevPy = py;
    playerStepTime = now;
    let pulled = 0;
    for (let i = 0; i < GADGET_HOOK_PULL; i++) {
      const result = advancePlayerToCell(px + dx, py + dy);
      if (result === 'moved') { pulled++; continue; }
      break; // Wand, Saeule, Rand oder Tod - stoppt den Zug
    }
    hookAnim = {
      ox: originC, oy: originR, dx, dy,
      reachCells: pulled > 0 ? pulled : 0.55,
      startTime: now,
      mode: pulled > 0 ? 'pull' : 'bounce'
    };
    if (pulled > 0) {
      triggerShake(3, 140);
      spawnEmote('💨', prevPx, prevPy);
    } else {
      triggerShake(2, 90);
    }
  }

  function spawnSwarmEnemy() {
    const personality = randomPersonality();
    const e = spawnEnemy(personality);
    if (e) {
      e.temporary = true;
      enemies.push(e);
      swarmEnemies.push(e);
    }
  }

  function clearSwarmEnemies() {
    for (const se of swarmEnemies) {
      const idx = enemies.indexOf(se);
      if (idx >= 0) enemies.splice(idx, 1);
    }
    swarmEnemies = [];
  }

  function activatePowerDown(type) {
    const now = performance.now();
    if (type === 'confuse') confuseUntil = now + 4000;
    else if (type === 'fog') fogUntil = now + 5000;
    else if (type === 'alarm') { alarmUntil = now + 3500; triggerShake(4, 250); vibrate([50, 30, 50]); }
    else if (type === 'slow') slowUntil = now + 4000;
    else if (type === 'swarm') { swarmUntil = now + 6000; spawnSwarmEnemy(); }
    else if (type === 'drunk') drunkUntil = now + 5500;
    updateStats();
    sndPowerDown(type);
  }

  function currentPlayerInterval() {
    const now = performance.now();
    if (now < speedUntil) return playerInterval * 0.55;
    if (now < slowUntil) return playerInterval * 1.6;
    return playerInterval;
  }

  function checkPowerUpPickup(nx, ny) {
    const idx = powerUps.findIndex(p => p.c === nx && p.r === ny);
    if (idx >= 0) {
      const p = powerUps[idx];
      const now = performance.now();
      revealPopups.push({
        x: nx, y: ny, type: p.type, kind: p.kind,
        startTime: now, resolveAt: now + ROULETTE_MS, applied: false, lastTickIdx: -1
      });
      powerUps.splice(idx, 1);
      tutorialFlag('orb');
    }
  }

  function updatePendingReveals(now) {
    for (const rp of revealPopups) {
      if (rp.applied) continue;
      if (now >= rp.resolveAt) {
        rp.applied = true;
        if (rp.kind === 'down') activatePowerDown(rp.type);
        else activatePowerUp(rp.type);
        continue;
      }
      const idx = Math.floor((now - rp.startTime) / ROULETTE_STEP_MS) % ALL_MYSTERY_TYPES.length;
      if (idx !== rp.lastTickIdx) {
        rp.lastTickIdx = idx;
        sndRouletteTick();
      }
    }
  }
  // Eine einzelne Zellbewegung des Spielers - von normalem Schritt und Enterhaken geteilt.
  // Gibt 'moved', 'blocked' (Saeule/Grube/Rand) oder 'dead' (Spielende ausgeloest) zurueck.
  function advancePlayerToCell(nx, ny) {
    if (!inBounds(nx, ny)) return 'blocked';
    if (isObstacle(grid[ny][nx])) return 'blocked';

    const nowT = performance.now();
    const enemyAhead = killEnemyCollisionCheck(nx, ny);
    if (enemyAhead && nowT >= shieldUntil && nowT < spikesUntil) {
      const hit = enemies.find(e => e.c === nx && e.r === ny);
      if (hit) killEnemyByShot(hit);
    } else if (grid[ny][nx] === TRAIL) {
      endGame('You touched your own line.', '😵');
      return 'dead';
    } else if (enemyAhead && nowT >= shieldUntil) {
      endGame('A guard caught you.', '😈');
      return 'dead';
    }

    checkPowerUpPickup(nx, ny);

    if (grid[ny][nx] === TERRITORY) {
      if (trail.length > 0) finalizeCapture();
      px = nx; py = ny;
    } else {
      trail.push([nx, ny]);
      if (trail.length > statLongestTrail) statLongestTrail = trail.length;
      grid[ny][nx] = TRAIL;
      px = nx; py = ny;
    }
    return 'moved';
  }

  function stepPlayer() {
    prevPx = px; prevPy = py;
    playerStepTime = performance.now();
    dir = nextDir;
    const [dx, dy] = dirDelta(dir);
    advancePlayerToCell(px + dx, py + dy);
  }

  function finalizeCapture() {
    // Im Tutorial zaehlt schon die geschlossene Schleife, auch wenn sie nichts umschliesst.
    if (trail.length > 0) tutorialFlag('captured');
    for (const [tx, ty] of trail) grid[ty][tx] = TERRITORY;
    trail = [];

    const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    const components = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === EMPTY && !visited[r][c]) {
          const comp = [];
          const stack = [[r, c]];
          visited[r][c] = true;
          while (stack.length) {
            const [cr, cc] = stack.pop();
            comp.push([cr, cc]);
            const neigh = [[cr+1,cc],[cr-1,cc],[cr,cc+1],[cr,cc-1]];
            for (const [nr, nc] of neigh) {
              if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
              if (visited[nr][nc]) continue;
              if (grid[nr][nc] !== EMPTY) continue;
              visited[nr][nc] = true;
              stack.push([nr, nc]);
            }
          }
          components.push(comp);
        }
      }
    }

    let gained = 0;
    let gainSumR = 0, gainSumC = 0;
    for (const comp of components) {
      const hasEnemy = comp.some(([r, c]) => enemies.some(e => e.r === r && e.c === c));
      if (!hasEnemy) {
        for (const [r, c] of comp) {
          grid[r][c] = TERRITORY;
          flashCells.push({ r, c, time: performance.now() });
          gainSumR += r; gainSumC += c;
          gained++;
        }
      }
    }
    // Welle aus dem Schwerpunkt der eroberten Flaeche - je groesser der Claim,
    // desto weiter laeuft sie.
    if (gained > 0) {
      addRipple(gainSumC / gained, gainSumR / gained,
                Math.min(14, 2.5 + Math.sqrt(gained) * 1.4),
                520 + Math.min(380, gained * 6), '127,224,160', 0.8);
    }
    if (!bonusClaimed && bonusCells.length) {
      const allClaimed = bonusCells.every(b => grid[b.r][b.c] === TERRITORY);
      if (allClaimed) {
        bonusClaimed = true;
        tutorialFlag('bonus');
        const bonusScore = bonusCells.length * 5 * (BONUS_MULT - 1);
        score += bonusScore;
        const mid = bonusCells[Math.floor(bonusCells.length / 2)];
        milestonePopups.push({ x: mid.c, y: mid.r, text: '⭐ Bonus +' + bonusScore, startTime: performance.now() });
        spawnFireworkBurst(mid.c * CELL + CELL / 2, mid.r * CELL + CELL / 2, ['#ffd23f', '#ffb03a', '#fff2b0']);
        sndPowerUp('speed');
      }
    }
    if (gained > statBiggestCut) statBiggestCut = gained;
    // Waechter, die in einer Grube eingeschlossen wurden, koennen sich nie mehr bewegen.
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const stuck = [[e.r+1,e.c],[e.r-1,e.c],[e.r,e.c+1],[e.r,e.c-1]].every(([nr, nc]) =>
        nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || grid[nr][nc] === TERRITORY || grid[nr][nc] === BLOCK);
      if (stuck) {
        enemies.splice(i, 1);
        const si = swarmEnemies.indexOf(e);
        if (si >= 0) swarmEnemies.splice(si, 1);
        if (!e.temporary) {
          const ne = spawnEnemy(randomPersonality());
          if (ne) enemies.push(ne);
        }
      }
    }
    score += Math.round(gained * 5 * (1 + perks.payday * 0.25));
    if (gained > 0) {
      comboCount++;
      const mult = comboMultiplier();
      const bonus = Math.round(gained * 5 * (mult - 1));
      score += bonus;
      sndCapture(gained, comboCount);
      if (gained > 12) {
        triggerShake(Math.min(7, 2 + gained * 0.08), 220);
        spawnEmote('💪', px, py);
      }
      if (gained > 2) {
        spawnFireworkBurst(px * CELL + CELL / 2, py * CELL + CELL / 2, ['#63c96a', '#7fe0a0', '#ffd23f']);
      }
      if (comboCount >= 2) {
        comboPopups.push({ x: px, y: py, combo: comboCount, mult, startTime: performance.now() });
      }
    }
    const freshPct = Math.round((countTerritory() / totalCells()) * 100);

    if (!milestone25Shown && freshPct >= 25) {
      milestone25Shown = true;
      milestonePopups.push({ x: px, y: py, text: '🎉 25%!', startTime: performance.now() });
      sndPowerUp('shield');
    }
    if (!milestone50Shown && freshPct >= 50) {
      milestone50Shown = true;
      milestonePopups.push({ x: px, y: py, text: '🔥 Halfway!', startTime: performance.now() });
      sndPowerUp('speed');
    }
    if (freshPct >= 75 && !levelReadyToComplete && (!tutorialActive || tutorialAllowCashOut)) {
      levelReadyToComplete = true;
    }

    updateStats();

    if (freshPct >= 100 && !celebrating) {
      triggerLevelCompleteFireworks();
    }
  }

  function spawnFireworkBurst(cx, cy, customPalette) {
    const palette = customPalette || ['#ff4d4d', '#ffd23f', '#4f7ee5', '#63c96a', '#e89b3d', '#b06fe0', '#7fdcff'];
    const count = 22;
    const now = performance.now();
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 90 + Math.random() * 150;
      fireworkParticles.push({
        x0: cx, y0: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: palette[Math.floor(Math.random() * palette.length)],
        startTime: now,
        life: 700 + Math.random() * 500
      });
    }
  }

  function triggerLevelCompleteFireworks() {
    if (celebrating) return;
    if (tutorialActive) {
      levelReadyToComplete = false;
      if (tutorialAllowCashOut) {
        // Auszahlen ist der letzte Tutorialschritt - kein Levelwechsel.
        sndVictoryFanfare();
        vibrate([30, 30, 30, 30, 60]);
        tutorialFlag('cashedOut');
        return;
      }
      // Feld komplett erobert, Etappe aber noch offen: frisches Feld, sonst haengt man fest.
      if (!TUTORIAL_STAGES[tutorialStage].done()) {
        const idx = tutorialStage;
        sndLevelUp();
        showTutorialBar('Whole board claimed! Here is a fresh one - the step is still open.',
                        'Step ' + (idx + 1) + ' of ' + TUTORIAL_STAGES.length, true);
        running = false;
        cancelAnimationFrame(rafId);
        setTimeout(() => {
          if (!tutorialActive) return;
          applyTutorialStage(idx);
          dying = false;
          gameOver = false;
          running = true;
          lastTime = 0;
          cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(loop);
        }, 1100);
      }
      return;
    }
    celebrating = true;
    levelReadyToComplete = false;
    const lv = level + 1;

    const bonusPct = Math.min(100, Math.max(0, Math.floor((capturedPct - 75) / 5)) * 5);
    const levelBonus = Math.round(200 * (1 + bonusPct / 100));
    score += levelBonus;
    const isNewHigh = saveHighScoreIfNeeded();
    updateStats();
    sndVictoryFanfare();
    vibrate([30, 30, 30, 30, 60]);

    unlockAchievement('first_level');
    if (!lifeLostThisLevel) unlockAchievement('untouchable');
    if (bonusPct >= 15) {
      gamblerStreak++;
      if (gamblerStreak >= 3) unlockAchievement('gambler');
    } else {
      gamblerStreak = 0;
    }

    const burstCount = 5;
    for (let i = 0; i < burstCount; i++) {
      const delay = i * 220 + Math.random() * 100;
      setTimeout(() => {
        const cx = Math.random() * boardCanvas.width;
        const cy = CELL * 2 + Math.random() * Math.max(1, (ROWS - 4)) * CELL;
        const palette = isNewHigh ? ['#ffd23f', '#ffe27a', '#fff2b8', '#ff8a3d'] : undefined;
        spawnFireworkBurst(cx, cy, palette);
        sndFireworkPop();
      }, delay);
    }

    if (isNewHigh) {
      setTimeout(() => sndHighscoreSting(), 100);
    }

    const bonusText = bonusPct > 0 ? (' Risk bonus: +' + bonusPct + '%!') : '';
    const highText = isNewHigh ? '🏆 NEW HIGH SCORE! ' : '';

    setTimeout(() => {
      celebrating = false;
      fireworkParticles = [];
      statLevelsCleared++;
      resetLevel(lv);
      running = false;
      openShop('Level ' + lv + ' - choose your edge', () => {
        showOverlay('Level ' + lv + '!', highText + 'Territory secured.' + bonusText + ' Onward - faster and with more guards.', 'Continue');
      });
    }, 1900);
  }

  // Schiesst genau einen Block aus der eigenen Linie heraus - der Rest bleibt liegen.
  function shootOutTrailCell(cx, cy) {
    const idx = trail.findIndex(([tx, ty]) => tx === cx && ty === cy);
    if (idx < 0) return 0;
    trail.splice(idx, 1);
    if (grid[cy][cx] === TRAIL) grid[cy][cx] = EMPTY;
    flashCells.push({ r: cy, c: cx, time: performance.now() });
    comboCount = 0;
    tutorialFlag('selfShot');
    const penalty = Math.min(score, SELF_CUT_COST);
    score -= penalty;
    updateStats();
    sndLineCut();
    triggerShake(4, 180);
    vibrate([35, 25, 35]);
    milestonePopups.push({ x: cx, y: cy, text: '🔫 Blasted free -' + penalty, startTime: performance.now() });
    return penalty;
  }

  // Trennt die Linie an (cx, cy): alles vom Anfang bis zur Schnittstelle geht verloren.
  function cutTrailAt(cx, cy, emoji) {
    const idx = trail.findIndex(([tx, ty]) => tx === cx && ty === cy);
    if (idx < 0) return 0;
    const removed = trail.splice(0, idx + 1);
    for (const [tx, ty] of removed) {
      if (grid[ty][tx] === TRAIL) grid[ty][tx] = EMPTY;
      flashCells.push({ r: ty, c: tx, time: performance.now() });
    }
    comboCount = 0;
    tutorialFlag('lineCut');
    sndLineCut();
    triggerShake(5, 200);
    vibrate([40, 30, 40]);
    milestonePopups.push({ x: cx, y: cy, text: (emoji || '✂️') + ' Line cut!', startTime: performance.now() });
  }

  // --- Bewegliche Saeulen ---
  let movingBlocks = [];
  const MOVING_BLOCK_INTERVAL = 1100;

  function updateMovingBlocks(delta) {
    if (!movingBlocks.length) return;
    for (const mb of movingBlocks) {
      mb.timer += delta;
      if (mb.timer < MOVING_BLOCK_INTERVAL) continue;
      mb.timer = Math.min(mb.timer - MOVING_BLOCK_INTERVAL, MOVING_BLOCK_INTERVAL);
      let moved = false;
      for (let attempt = 0; attempt < 2 && !moved; attempt++) {
        const nr = mb.r + mb.dr, nc = mb.c + mb.dc;
        const blockedCell = !inBounds(nc, nr) || nr < 1 || nr > ROWS - 2 || nc < 1 || nc > COLS - 2 ||
          grid[nr][nc] === TERRITORY || grid[nr][nc] === BLOCK || grid[nr][nc] === PIT ||
          enemies.some(e => e.r === nr && e.c === nc) || (nc === px && nr === py);
        if (blockedCell) { mb.dr = -mb.dr; mb.dc = -mb.dc; continue; }
        if (grid[nr][nc] === TRAIL) cutTrailAt(nc, nr, '🪨');
        grid[mb.r][mb.c] = EMPTY;
        mb.prevR = mb.r; mb.prevC = mb.c;
        mb.r = nr; mb.c = nc;
        grid[nr][nc] = BLOCK;
        moved = true;
      }
    }
  }

  function moveEnemies() {
    enemyStepTime = performance.now();
    // Ueber eine Kopie laufen: killEnemyByShot() kann waehrend der Schleife
    // Waechter entfernen und neue anhaengen.
    for (const e of enemies.slice()) {
      if (enemies.indexOf(e) === -1) continue; // in diesem Tick bereits entfernt
      e.prevR = e.r; e.prevC = e.c;
      const opts = [[0,-1],[0,1],[-1,0],[1,0]].filter(([dx,dy]) => {
        const nx = e.c + dx, ny = e.r + dy;
        if (!inBounds(nx, ny)) return false;
        if (grid[ny][nx] === TERRITORY) return false;
        if (grid[ny][nx] === BLOCK) return false; // Gruben duerfen Waechter nutzen, Saeulen nicht
        if (grid[ny][nx] === TRAIL && performance.now() < trailGuardUntil) return false;
        return true;
      });
      if (opts.length === 0) continue;

      if (e.personality === 'nervous' && Math.random() < 0.28) {
        continue; // stockt kurz, wirkt unruhig
      }

      let choice;
      const now = performance.now();
      const alarmActive = now < alarmUntil;

      // Waechter jagen nur, was sie sehen - und merken es sich kurz.
      const seesPlayer = canSeePlayer(e);
      if (seesPlayer) { e.huntingActive = true; e.lastSeenAt = now; }
      else if (e.huntingActive && now - e.lastSeenAt > VISION_MEMORY) e.huntingActive = false;

      const isHuntingNow = alarmActive || e.huntingActive;
      if (isHuntingNow && !e.wasHunting) sndHunterAlert();
      e.wasHunting = isHuntingNow;

      if (isHuntingNow) {
        let best = null, bestDist = Infinity;
        for (const [dx, dy] of opts) {
          const nx = e.c + dx, ny = e.r + dy;
          const d = Math.abs(nx - px) + Math.abs(ny - py);
          if (d < bestDist) { bestDist = d; best = [dx, dy]; }
        }
        choice = best;
      } else if (e.personality === 'cutter' && trail.length) {
        // Sucht die eigene Linie statt den Spieler
        let target = trail[0], tDist = Infinity;
        for (const [tx, ty] of trail) {
          const d = Math.abs(tx - e.c) + Math.abs(ty - e.r);
          if (d < tDist) { tDist = d; target = [tx, ty]; }
        }
        let best = null, bestDist = Infinity;
        for (const [dx, dy] of opts) {
          const nx = e.c + dx, ny = e.r + dy;
          const d = Math.abs(nx - target[0]) + Math.abs(ny - target[1]);
          if (d < bestDist) { bestDist = d; best = [dx, dy]; }
        }
        choice = best;
      } else if (e.personality === 'guardian') {
        let best = null, bestScore = -Infinity;
        for (const [dx, dy] of opts) {
          const nx = e.c + dx, ny = e.r + dy;
          let terrCount = 0;
          for (const [ddx, ddy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
            const cx = nx + ddx, cy = ny + ddy;
            if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) continue;
            if (grid[cy][cx] === TERRITORY) terrCount++;
          }
          const score = -terrCount + Math.random() * 0.5;
          if (score > bestScore) { bestScore = score; best = [dx, dy]; }
        }
        choice = best;
      } else if (e.personality === 'nervous') {
        choice = opts[Math.floor(Math.random() * opts.length)];
      } else {
        if (Math.random() < 0.65) {
          const keepGoing = opts.find(([dx,dy]) => dx === e.dc0 && dy === e.dr0);
          choice = keepGoing || opts[Math.floor(Math.random() * opts.length)];
        } else {
          choice = opts[Math.floor(Math.random() * opts.length)];
        }
      }

      e.dc0 = choice[0]; e.dr0 = choice[1];
      e.c += choice[0]; e.r += choice[1];

      if (e.c === px && e.r === py) {
        const nowT = performance.now();
        if (nowT >= shieldUntil) {
          if (nowT < spikesUntil) {
            killEnemyByShot(e);
            continue;
          }
          endGame('A guard caught you.', '😈');
          return;
        }
      } else if (grid[e.r][e.c] === TRAIL) {
        if (e.personality === 'cutter') {
          cutTrailAt(e.c, e.r, '✂️');
        } else {
          endGame('A guard cut your line.', '✂️');
          return;
        }
      }
    }
  }

  function triggerDeathFlash() {
    const flash = document.getElementById('deathFlash');
    flash.classList.remove('active');
    void flash.offsetWidth;
    flash.classList.add('active');
  }

  function endGame(reason, emoji) {
    if (!running || dying) return; // verhindert doppelten Lebensabzug bei mehrfachem Aufruf
    if (tutorialActive) {
      // Im Tutorial kostet ein Fehler nichts - die Etappe startet einfach neu.
      dying = true;
      sndGameOver(emoji || '💀');
      triggerShake(6, 260);
      document.getElementById('board-wrap').classList.add('dimming');
      running = false;
      tutorialRetryStage(reason);
      return;
    }
    dying = true;
    lives--;
    comboCount = 0;
    lifeLostThisLevel = true;
    updateStats();
    gameOverEmoji = emoji || '💀';
    sndGameOver(gameOverEmoji);
    triggerShake(9, 380);
    triggerDeathFlash();
    document.getElementById('board-wrap').classList.add('dimming');
    vibrate([70, 40, 90]);

    setTimeout(() => {
      running = false;
      dying = false;

      if (lives <= 0) {
        gameOver = true;
        lifeLostFlag = false;
        const isNewHigh = saveHighScoreIfNeeded();
        let closeText;
        if (levelReadyToComplete || capturedPct >= 75) {
          closeText = ' You already had ' + capturedPct + '% - the bonus is gone, but so close!';
        } else {
          closeText = ' Only ' + (75 - capturedPct) + '% left to the next level!';
        }
        const highText = isNewHigh ? '🏆 New high score! ' : '';
        const statsLine = '\n\n📊 Biggest cut: ' + statBiggestCut + ' cells  ·  Longest line: ' +
                          statLongestTrail + '  ·  Guards down: ' + statKills +
                          '  ·  Levels cleared: ' + statLevelsCleared;
        showOverlay(gameOverEmoji + ' Game Over', highText + reason + ' Score: ' + score + '.' + closeText + statsLine,
                    '▶ Again (' + MODES[gameMode].label + ')');
        document.getElementById('modeBtn').classList.remove('hidden');
      } else {
        gameOver = false;
        lifeLostFlag = true;
        showOverlay(gameOverEmoji + ' Life lost!', reason + ' ' + lives + ' lives left. Level restarts.', 'Continue');
      }
    }, 420);
  }

  let shopOpen = false;

  function drawableCards() {
    return PERK_CARDS.filter(c => perkCount(c.id) < c.max);
  }

  function openShop(nextLevelLabel, onDone) {
    const pool = drawableCards();
    if (pool.length === 0) { onDone(); return; }
    const picks = [];
    const copy = pool.slice();
    while (picks.length < 3 && copy.length) {
      picks.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }
    shopOpen = true;
    const row = document.getElementById('shopRow');
    row.innerHTML = '';
    for (const card of picks) {
      const b = document.createElement('button');
      b.className = 'card';
      const owned = perkCount(card.id);
      b.innerHTML = '<span class="cardIcon">' + card.icon + '</span>' +
        '<span><span class="cardName">' + card.name + (owned ? ' ×' + (owned + 1) : '') + '</span><br>' +
        '<span class="cardDesc">' + card.desc + '</span></span>';
      b.addEventListener('click', () => {
        if (!shopOpen) return;
        shopOpen = false;
        card.apply();
        sndPowerUp('shield');
        document.getElementById('shop').classList.add('hidden');
        onDone();
      });
      row.appendChild(b);
    }
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('modeSelect').classList.add('hidden');
    document.getElementById('modeBtn').classList.add('hidden');
    document.getElementById('skipBtn').classList.add('hidden');
    document.getElementById('overlayText').classList.add('hidden');
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('shop').classList.remove('hidden');
    document.getElementById('overlayTitle').textContent = nextLevelLabel;
  }

  function showOverlay(title, text, btnLabel) {
    shopOpen = false;
    document.getElementById('tutorialBtn').classList.add('hidden');
    document.getElementById('shop').classList.add('hidden');
    document.getElementById('startBtn').classList.remove('hidden');
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('modeSelect').classList.add('hidden');
    document.getElementById('modeBtn').classList.add('hidden');
    document.getElementById('overlayText').classList.remove('hidden');
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlayText').textContent = text;
    document.getElementById('startBtn').textContent = btnLabel;
  }
  function hideOverlay() {
    document.getElementById('overlay').classList.add('hidden');
  }

  function draw(now) {
    const dtMs = Math.min(120, Math.max(0, now - (lastDrawTime || now)));
    lastDrawTime = now;

    // Bedrohungsgrad: dieselbe Kurve, die schon Musik und Spannungs-Vignette treibt
    // (computeTension), aber hier eigenstaendig geglaettet - updateAmbient laeuft
    // nur mit aktivem Audio, das Bild soll auch stumm reagieren.
    // Aktive Jagd oder Alarm zieht den Wert sofort auf Anschlag.
    const tensionNow = (running && !paused && !gameOver) ? computeTension(now) : 0;
    const hunted = (now < alarmUntil || enemies.some(e => e.huntingActive)) ? 1 : 0;
    const threatTarget = Math.max(tensionNow, hunted);
    threatDisp = easeValue(threatDisp, threatTarget, dtMs, threatTarget > threatDisp ? 90 : 500);
    const gridPulse = 0.5 + 0.5 * Math.sin(now / (1500 - threatDisp * 1150));
    const gridAlpha = 0.05 + gridPulse * 0.03 + threatDisp * (0.10 + gridPulse * 0.20);
    const gr = Math.round(127 + 128 * threatDisp);
    const gg = Math.round(224 - 150 * threatDisp);
    const gb = Math.round(160 - 105 * threatDisp);

    // Spieler: Blickrichtung weich nachziehen, mit leichtem Einlenken
    const [tdx, tdy] = dirDelta(dir);
    const targetHeading = Math.atan2(tdy, tdx);
    const pendingTurn = shortestAngleDelta(playerHeadingDisp, targetHeading);
    playerHeadingDisp = easeAngle(playerHeadingDisp, targetHeading, dtMs, 52);
    playerLeanDisp = easeValue(playerLeanDisp, Math.max(-0.38, Math.min(0.38, pendingTurn * 0.45)), dtMs, 60);

    // Waechter: Kegelwinkel weich nachziehen
    for (const e of enemies) {
      const target = enemyFacing(e);
      if (e.angleDisp === undefined) e.angleDisp = target;
      else e.angleDisp = easeAngle(e.angleDisp, target, dtMs, 95);
      // Blick: nach vorne, ausser er hat dich entdeckt - dann folgt der Blick dir
      const alerted = e.huntingActive || now < alarmUntil;
      const eyeTarget = alerted ? Math.atan2(py - e.r, px - e.c) : e.angleDisp;
      if (e.eyeAngleDisp === undefined) e.eyeAngleDisp = eyeTarget;
      else e.eyeAngleDisp = easeAngle(e.eyeAngleDisp, eyeTarget, dtMs, alerted ? 70 : 110);
      // Traegerer Winkel: die Flossen schwingen der Drehung hinterher
      if (e.tailAngleDisp === undefined) e.tailAngleDisp = e.angleDisp;
      else e.tailAngleDisp = easeAngle(e.tailAngleDisp, e.angleDisp, dtMs, 230);
    }

    const playerT = Math.min(1, (now - playerStepTime) / currentPlayerInterval());
    const dispPx = prevPx + (px - prevPx) * playerT;
    const dispPy = prevPy + (py - prevPy) * playerT;
    const camFollow = cameraMode === 'follow' || cameraMode === 'push';

    const bgT = threatDisp * (0.75 + gridPulse * 0.25);
    ctx.fillStyle = 'rgb(' + Math.round(10 + 32 * bgT) + ',' +
                             Math.round(15 - 7 * bgT) + ',' +
                             Math.round(11 - 3 * bgT) + ')';
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

    // Tiefenschicht: folgt der Kamera nur zu PARALLAX_FACTOR und driftet zusaetzlich
    // ganz langsam, damit der Hintergrund auch bei stehender Kamera atmet.
    if (bgParallaxPattern) {
      const camX = camFollow ? boardCanvas.width / 2 - (dispPx * CELL + CELL / 2) : 0;
      const camY = camFollow ? boardCanvas.height / 2 - (dispPy * CELL + CELL / 2) : 0;
      const ox = camX * PARALLAX_FACTOR + Math.sin(now / 9000) * CELL * 0.6;
      const oy = camY * PARALLAX_FACTOR + Math.cos(now / 11000) * CELL * 0.45;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = bgParallaxPattern;
      ctx.fillRect(-ox, -oy, boardCanvas.width, boardCanvas.height);
      ctx.restore();
    }

    if (bgVignette) { ctx.fillStyle = bgVignette; ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height); }
    if (bgNoisePattern) { ctx.fillStyle = bgNoisePattern; ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height); }

    ctx.save();
    if (camFollow) {
      ctx.translate(boardCanvas.width / 2 - (dispPx * CELL + CELL / 2),
                    boardCanvas.height / 2 - (dispPy * CELL + CELL / 2));
    }
    const shakeRemaining = shakeEndTime - now;
    if (shakeRemaining > 0) {
      const shakeT = shakeRemaining / shakeDuration;
      const mag = shakeMagnitude * shakeT;
      ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
    }

    const drunkActive = now < drunkUntil;
    if (drunkActive) {
      const tt = now / 1000;
      const angle = Math.sin(tt * 5.2) * 0.11 + Math.sin(tt * 3.1) * 0.05;
      const dx = Math.sin(tt * 7.4) * CELL * 0.42 + Math.sin(tt * 4.1) * CELL * 0.15;
      const dy = Math.cos(tt * 6.3) * CELL * 0.34 + Math.cos(tt * 3.7) * CELL * 0.12;
      const pivotX = camFollow ? dispPx * CELL + CELL / 2 : COLS * CELL / 2;
      const pivotY = camFollow ? dispPy * CELL + CELL / 2 : ROWS * CELL / 2;
      ctx.translate(pivotX, pivotY);
      ctx.rotate(angle);
      ctx.translate(-pivotX + dx, -pivotY + dy);
      ctx.filter = 'blur(2.4px)';
    }

    ctx.strokeStyle = 'rgba(' + gr + ',' + gg + ',' + gb + ',' + gridAlpha.toFixed(3) + ')';
    ctx.lineWidth = 1 + threatDisp * 1.1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke();
    }
    ctx.lineWidth = 1;

    for (let i = flashCells.length - 1; i >= 0; i--) {
      if (now - flashCells[i].time > 400) flashCells.splice(i, 1);
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = grid[r][c];
        if (v === BLOCK) {
          const mover = movingBlocks.find(m => m.r === r && m.c === c);
          if (mover) {
            ctx.fillStyle = '#4a4634';
            ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
            ctx.fillStyle = '#5e5a3f';
            ctx.fillRect(c*CELL+2, r*CELL+2, CELL-4, CELL-4);
            ctx.strokeStyle = 'rgba(255,210,63,0.55)';
            ctx.lineWidth = Math.max(1, CELL * 0.06);
            ctx.strokeRect(c*CELL+2.5, r*CELL+2.5, CELL-5, CELL-5);
            // Richtungspfeil
            ctx.save();
            ctx.translate(c*CELL + CELL/2, r*CELL + CELL/2);
            ctx.rotate(Math.atan2(mover.dr, mover.dc));
            ctx.fillStyle = 'rgba(255,226,140,0.85)';
            ctx.beginPath();
            ctx.moveTo(CELL*0.22, 0);
            ctx.lineTo(-CELL*0.10, -CELL*0.13);
            ctx.lineTo(-CELL*0.10, CELL*0.13);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            continue;
          }
          ctx.fillStyle = '#3a4238';
          ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
          ctx.fillStyle = '#4c5749';
          ctx.fillRect(c*CELL+2, r*CELL+2, CELL-4, CELL-4);
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.fillRect(c*CELL+2, r*CELL+2, CELL-4, 3);
          ctx.strokeStyle = 'rgba(0,0,0,0.5)';
          ctx.lineWidth = 1;
          ctx.strokeRect(c*CELL+0.5, r*CELL+0.5, CELL-1, CELL-1);
          continue;
        }
        if (v === PIT) {
          ctx.fillStyle = '#05070a';
          ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
          const pg = ctx.createRadialGradient(
            c*CELL+CELL/2, r*CELL+CELL/2, CELL*0.1,
            c*CELL+CELL/2, r*CELL+CELL/2, CELL*0.6);
          pg.addColorStop(0, 'rgba(0,0,0,1)');
          pg.addColorStop(1, 'rgba(40,60,80,0.35)');
          ctx.fillStyle = pg;
          ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
          continue;
        }
        if (v === TERRITORY) {
          ctx.fillStyle = '#2f8f5c';
          ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(c*CELL, r*CELL, CELL, 2);
        } else if (v === TRAIL) {
          if (c === px && r === py && playerT < 1) {
            // neuester Trail-Block: erst einblenden, wenn der Punkt visuell ankommt
          } else {
            const guarded = now < trailGuardUntil;
            const riskColor = guarded ? '#3fd6b0' : trailRiskColor(trail.length);
            ctx.save();
            ctx.shadowColor = riskColor;
            ctx.shadowBlur = CELL * 0.55;
            ctx.fillStyle = riskColor;
            ctx.fillRect(c*CELL+3, r*CELL+3, CELL-6, CELL-6);
            ctx.restore();
            if (guarded) {
              const glowPulse = 0.5 + Math.sin(now / 180 + c + r) * 0.5;
              ctx.strokeStyle = 'rgba(200,255,240,' + (0.35 + glowPulse * 0.4) + ')';
              ctx.lineWidth = Math.max(1, CELL * 0.05);
              ctx.strokeRect(c*CELL+3, r*CELL+3, CELL-6, CELL-6);
            }
          }
        }
      }
    }

    for (const f of flashCells) {
      const t = (now - f.time) / 400;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * (1 - t)) + ')';
      ctx.fillRect(f.c*CELL, f.r*CELL, CELL, CELL);
    }

    // Energiewellen ueber dem Feld, aber unter Spieler und Waechtern
    for (let i = bgRipples.length - 1; i >= 0; i--) {
      const rp = bgRipples[i];
      const t = (now - rp.start) / rp.dur;
      if (t >= 1) { bgRipples.splice(i, 1); continue; }
      const rad = rp.maxCells * CELL * (1 - Math.pow(1 - t, 2.6));
      if (rad < 0.5) continue;
      const alpha = (1 - t) * (1 - t) * rp.strength;
      const rcx = rp.cx * CELL + CELL / 2, rcy = rp.cy * CELL + CELL / 2;
      ctx.save();
      const rg = ctx.createRadialGradient(rcx, rcy, rad * 0.68, rcx, rcy, rad);
      rg.addColorStop(0, 'rgba(' + rp.color + ',0)');
      rg.addColorStop(1, 'rgba(' + rp.color + ',' + (alpha * 0.30).toFixed(3) + ')');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(rcx, rcy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(' + rp.color + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, CELL * 0.15 * (1 - t));
      ctx.beginPath(); ctx.arc(rcx, rcy, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    for (let i = nearMissPopups.length - 1; i >= 0; i--) {
      const p = nearMissPopups[i];
      const t = (now - p.startTime) / 900;
      if (t >= 1) { nearMissPopups.splice(i, 1); continue; }
      const alpha = 1 - t;
      const yOff = -t * CELL * 1.4;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffd23f';
      ctx.font = '700 ' + Math.floor(CELL * 0.55) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      const tx = p.x * CELL + CELL / 2, ty = p.y * CELL + CELL / 2 + yOff - CELL * 0.6;
      ctx.strokeText('Whew!', tx, ty);
      ctx.fillText('Whew!', tx, ty);
      ctx.restore();
    }

    for (let i = comboPopups.length - 1; i >= 0; i--) {
      const p = comboPopups[i];
      const t = (now - p.startTime) / 1100;
      if (t >= 1) { comboPopups.splice(i, 1); continue; }
      const alpha = t < 0.85 ? 1 : 1 - (t - 0.85) / 0.15;
      const bounce = t < 0.22 ? 1.5 - (t / 0.22) * 0.5 : 1;
      const yOff = -t * CELL * 1.1;
      const cx = p.x * CELL + CELL / 2;
      const cy = p.y * CELL + CELL / 2 + yOff - CELL * 1.1;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.scale(bounce, bounce);

      const size = Math.floor(CELL * (0.5 + Math.min(p.combo, 8) * 0.045));
      ctx.font = '800 ' + size + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const grad = ctx.createLinearGradient(0, -size/2, 0, size/2);
      grad.addColorStop(0, '#ffe27a');
      grad.addColorStop(1, '#ff6a3d');

      ctx.strokeStyle = 'rgba(30,10,0,0.75)';
      ctx.lineWidth = 4;
      ctx.strokeText('🔥 COMBO ×' + p.mult.toFixed(1), 0, 0);
      ctx.fillStyle = grad;
      ctx.fillText('🔥 COMBO ×' + p.mult.toFixed(1), 0, 0);
      ctx.restore();
    }

    for (let i = milestonePopups.length - 1; i >= 0; i--) {
      const m = milestonePopups[i];
      const t = (now - m.startTime) / 1000;
      if (t >= 1) { milestonePopups.splice(i, 1); continue; }
      const bounce = t < 0.2 ? 1.4 - (t / 0.2) * 0.4 : 1;
      const alpha = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;
      const mx = m.x * CELL + CELL / 2, my = m.y * CELL + CELL / 2 - CELL * 1.6 - t * CELL * 0.6;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(mx, my);
      ctx.scale(bounce, bounce);
      ctx.font = '800 ' + Math.floor(CELL * 0.5) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      ctx.strokeText(m.text, 0, 0);
      ctx.fillStyle = '#7fe0a0';
      ctx.fillText(m.text, 0, 0);
      ctx.restore();
    }

    // Bonuszone: goldener Rahmen, solange sie noch nicht gesichert ist
    if (bonusCells.length && !bonusClaimed) {
      const pulse = 0.55 + Math.sin(now / 280) * 0.3;
      for (const b of bonusCells) {
        ctx.fillStyle = 'rgba(255,210,63,' + (0.10 + pulse * 0.10) + ')';
        ctx.fillRect(b.c*CELL, b.r*CELL, CELL, CELL);
        ctx.strokeStyle = 'rgba(255,210,63,' + (0.35 + pulse * 0.45) + ')';
        ctx.lineWidth = Math.max(1, CELL * 0.06);
        ctx.strokeRect(b.c*CELL+2, b.r*CELL+2, CELL-4, CELL-4);
      }
      const first = bonusCells[0];
      ctx.font = '700 ' + Math.floor(CELL * 0.5) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,226,120,' + (0.5 + pulse * 0.5) + ')';
      ctx.fillText('×' + BONUS_MULT, first.c*CELL + CELL/2, first.r*CELL + CELL/2 + 1);
    }

    for (let i = revealPopups.length - 1; i >= 0; i--) {
      const rp = revealPopups[i];
      const age = now - rp.startTime;
      const totalLife = ROULETTE_MS + REVEAL_HOLD_MS;
      if (age >= totalLife) { revealPopups.splice(i, 1); continue; }

      if (age < ROULETTE_MS) {
        // Roulette: rasch wechselndes Icon an der Aufsammel-Stelle
        const spinIdx = Math.floor(age / ROULETTE_STEP_MS) % ALL_MYSTERY_TYPES.length;
        const spinType = ALL_MYSTERY_TYPES[spinIdx];
        const cx = rp.x * CELL + CELL / 2, cy = rp.y * CELL + CELL / 2;
        const wobble = 1 + Math.sin(age / 40) * 0.06;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(wobble, wobble);
        ctx.beginPath();
        ctx.arc(0, 0, CELL * 0.36, 0, Math.PI * 2);
        ctx.fillStyle = ALL_ICON_COLORS[spinType];
        ctx.globalAlpha = 0.9;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = Math.max(1.5, CELL * 0.05);
        ctx.stroke();
        ctx.font = '700 ' + Math.floor(CELL * 0.4) + 'px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#101414';
        ctx.fillText(ALL_ICON_SYMBOLS[spinType], 0, 1);
        ctx.restore();
      } else {
        // Reveal: das tatsaechliche Ergebnis fliegt hoch und verblasst
        const t = (age - ROULETTE_MS) / REVEAL_HOLD_MS;
        const bounce = t < 0.25 ? 1.5 - (t / 0.25) * 0.5 : 1;
        const alpha = t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35;
        const yOff = -t * CELL * 1.3;
        const rx = rp.x * CELL + CELL / 2, ry = rp.y * CELL + CELL / 2 + yOff - CELL * 0.6;
        const label = ALL_ICON_SYMBOLS[rp.type] + ' ' + ALL_ICON_NAMES[rp.type];
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(rx, ry);
        ctx.scale(bounce, bounce);
        ctx.font = '800 ' + Math.floor(CELL * 0.42) + 'px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(0,0,0,0.65)';
        ctx.lineWidth = 3;
        ctx.strokeText(label, 0, 0);
        ctx.fillStyle = ALL_ICON_COLORS[rp.type];
        ctx.fillText(label, 0, 0);
        ctx.restore();
      }
    }

    for (let i = fireworkParticles.length - 1; i >= 0; i--) {
      const p = fireworkParticles[i];
      const age = now - p.startTime;
      if (age < 0) continue;
      if (age > p.life) { fireworkParticles.splice(i, 1); continue; }
      const t = age / 1000;
      const px2 = p.x0 + p.vx * t;
      const py2 = p.y0 + p.vy * t + 0.5 * 200 * t * t;
      const alpha = 1 - age / p.life;
      const size = Math.max(2, CELL * 0.16);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(px2 - size / 2), Math.round(py2 - size / 2), size, size);
    }
    ctx.globalAlpha = 1;

    for (let i = shotProjectiles.length - 1; i >= 0; i--) {
      const sp = shotProjectiles[i];
      const t = (now - sp.startTime) / sp.life;
      if (t >= 1) { shotProjectiles.splice(i, 1); continue; }
      const tx = sp.x0 + (sp.x1 - sp.x0) * t;
      const ty = sp.y0 + (sp.y1 - sp.y0) * t;
      ctx.save();
      ctx.globalAlpha = 1 - t * 0.3;
      ctx.strokeStyle = '#fff2b8';
      ctx.lineWidth = Math.max(2, CELL * 0.1);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sp.x0 + (sp.x1 - sp.x0) * Math.max(0, t - 0.35), sp.y0 + (sp.y1 - sp.y0) * Math.max(0, t - 0.35));
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.beginPath();
      ctx.fillStyle = '#ffe27a';
      ctx.arc(tx, ty, CELL * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const p of powerUps) {
      const pulse = 1 + Math.sin(now / 260 + p.r + p.c) * 0.08;
      const cx = p.c*CELL + CELL/2, cy = p.r*CELL + CELL/2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse, pulse);
      ctx.beginPath();
      ctx.arc(0, 0, CELL*0.34, 0, Math.PI*2);
      ctx.fillStyle = MYSTERY_COLOR;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#101414';
      ctx.font = '700 ' + Math.floor(CELL * 0.4) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(MYSTERY_SYMBOL, 0, 1);
      ctx.restore();
    }

    const blinkOnGlobal = Math.floor(now / 110) % 2 === 0;

    const shieldRemaining = shieldUntil - now;
    const shieldActive = now < shieldUntil;
    const shieldBlinking = shieldActive && shieldRemaining < 900;
    if (shieldActive && !(shieldBlinking && !blinkOnGlobal)) {
      ctx.beginPath();
      ctx.arc(dispPx*CELL + CELL/2, dispPy*CELL + CELL/2, CELL*0.52, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(79,126,229,0.85)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    const spikesRemaining = spikesUntil - now;
    const spikesActive = now < spikesUntil;
    const spikesBlinking = spikesActive && spikesRemaining < 900;
    if (spikesActive && !(spikesBlinking && !blinkOnGlobal)) {
      const spikeCx = dispPx * CELL + CELL / 2, spikeCy = dispPy * CELL + CELL / 2;
      const spikeCount = 8;
      const rInner = CELL * 0.48, rOuter = CELL * 0.68;
      ctx.beginPath();
      for (let i = 0; i < spikeCount; i++) {
        const a0 = (i / spikeCount) * Math.PI * 2 + now / 500;
        const a1 = a0 + (Math.PI * 2) / spikeCount / 2;
        ctx.moveTo(spikeCx + Math.cos(a0) * rInner, spikeCy + Math.sin(a0) * rInner);
        ctx.lineTo(spikeCx + Math.cos(a1) * rOuter, spikeCy + Math.sin(a1) * rOuter);
        const a2 = a0 + (Math.PI * 2) / spikeCount;
        ctx.lineTo(spikeCx + Math.cos(a2) * rInner, spikeCy + Math.sin(a2) * rInner);
      }
      ctx.strokeStyle = 'rgba(201,117,46,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const speedRemaining = speedUntil - now;
    const speedActive = now < speedUntil;
    const speedBlinking = speedActive && speedRemaining < 900;
    const showSpeedColor = speedActive && !(speedBlinking && !blinkOnGlobal);

    // Bewegungs-Lehnen: Streckung/Stauchung entlang der animierten Blickrichtung
    const [pdx, pdy] = dirDelta(dir);
    const R = CELL * 0.38;
    const bounce = Math.sin(Math.min(1, playerT) * Math.PI);
    const stretch = 1 + bounce * 0.18;
    const squeeze = 1 - bounce * 0.13;
    const headX = Math.cos(playerHeadingDisp), headY = Math.sin(playerHeadingDisp);

    const pcx = dispPx * CELL + CELL / 2, pcy = dispPy * CELL + CELL / 2;

    // Wisch-Hinweis: Geisterfinger, der einmal quer zieht. Verschwindet nach dem ersten Wisch.
    const showSwipeHint = IS_TOUCH && !hasSwipedEver && running && !countdownActive && now < swipeHintUntil &&
      (tutorialActive ? tutorialStage === 0 : level === 1);
    if (showSwipeHint) {
      const cycle = 1800;
      const t = (now % cycle) / cycle;
      const ease = t < 0.75 ? (1 - Math.pow(1 - t / 0.75, 3)) : 1;
      const fade = t < 0.1 ? t / 0.1 : (t > 0.8 ? Math.max(0, 1 - (t - 0.8) / 0.2) : 1);
      const gx = COLS * CELL * 0.28 + ease * COLS * CELL * 0.34;
      const gy = ROWS * CELL * 0.62;
      ctx.save();
      ctx.globalAlpha = fade * 0.85;
      // Schleifspur
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = Math.max(2, CELL * 0.09);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(COLS * CELL * 0.28, gy);
      ctx.lineTo(gx, gy);
      ctx.stroke();
      // Fingerkuppe
      ctx.beginPath();
