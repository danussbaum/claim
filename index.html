<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230d1410'/%3E%3Crect x='10' y='10' width='36' height='36' fill='%232f8f5c'/%3E%3Crect x='54' y='10' width='36' height='36' fill='%232f8f5c'/%3E%3Crect x='10' y='54' width='36' height='36' fill='%232f8f5c'/%3E%3Crect x='58' y='58' width='28' height='28' fill='%23e3574a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claim">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/claim.css">
</head>
<body>
<div id="splash">
  <div id="splashGrid"></div>
  <div id="splashLogo">CLAIM</div>
  <div id="splashSub">Draw. Enclose. Survive.</div>
</div>
<div id="app">
  <div class="topbar">
    <h1>CLAIM</h1>
    <div class="stats">
      <div class="stat">AREA<span id="pct">14%</span></div>
      <div class="stat">SCORE<span id="score">0</span><span id="comboBadge" style="display:none;"></span></div>
      <div class="stat">LEVEL<span id="level">1</span></div>
      <div class="stat">LIVES<span id="lives">3</span></div>
    </div>
    <button id="musicBtn" aria-label="Sound on/off">🔊</button>
  </div>

  <div class="main">
    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="deathFlash"></div>
      <div id="boardGrain"></div>
      <div id="levelWipe"></div>
      <div id="achievementBanner">
        <span id="achEmoji"></span>
        <span id="achTitle"></span>
      </div>
      <div id="overlay">
        <h2 id="overlayTitle">Claim</h2>
        <div id="onboarding">
          <div id="obIcon" class="onboardIcon">✏️</div>
          <div id="obTitle" class="onboardStepTitle">Claim Territory</div>
          <div id="obText" class="onboardStepText"></div>
          <div id="obDots" class="onboardDots"></div>
        </div>
        <div id="shop" class="hidden">
          <div class="selectLabel">Pick one upgrade</div>
          <div id="shopRow"></div>
        </div>
        <div id="modeSelect" class="hidden">
          <button id="optionsToggle" type="button">⚙️ Options<span id="optionsSummary"></span></button>
          <div id="runOptions" class="hidden">
          <div class="selectLabel">Role</div>
          <div class="pillRow" id="roleRow"></div>
          <div class="selectLabel">Mode</div>
          <div class="pillRow" id="modeRow"></div>
          <div class="selectLabel">Camera</div>
          <div class="pillRow" id="cameraRow"></div>
          <div class="selectLabel">Gadget</div>
          <div class="pillRow" id="gadgetRow"></div>
          <div class="selectLabel">Guard voices</div>
          <div class="pillRow" id="voiceRow"></div>
          <div class="selectLabel">Volume</div>
          <div id="volumeRows"></div>
          <div class="selectDesc" id="selectDesc"></div>
          <button id="optionsBackBtn" type="button">✓ Done</button>
          </div>
        </div>
        <p id="overlayText" class="hidden"></p>
        <div id="overlayScore" class="hidden"></div>
        <div id="overlayPops" class="hidden"></div>
        <button class="primary" id="startBtn">Next</button>
        <button id="skipBtn">Skip - Play now</button>
        <button id="vsBtn" class="hidden">⚔️ 2 Player</button>
        <button id="tutorialBtn" class="hidden">🎓 Play tutorial</button>
        <div id="vsPanel" class="hidden">
          <canvas id="vsQr" class="hidden"></canvas>
          <p id="vsText"></p>
          <div id="vsButtons"></div>
          <div id="vsStatus"></div>
        </div>
        <button id="modeBtn" class="hidden">Change mode</button>
        <button id="quitCancelBtn" class="hidden">Keep playing</button>
      </div>
    </div>
  </div>

  <div id="tutorialBar" class="hidden">
    <div id="tutorialStep"></div>
    <div id="tutorialHint"></div>
    <button id="tutorialSkipBtn">Skip tutorial</button>
  </div>

  <div class="controls">
    <div class="btn pausecell" id="pauseBtn"><span id="pauseGlyph">⏸</span><div class="cashFill" id="cashFill"></div></div>
    <div class="btn up" id="btnUp">▲</div>
    <div class="btn info" id="infoCell"><span id="infoGlyph">⚡<span id="boosts">3</span></span><div class="boostFill" id="boostFill"></div></div>
    <div class="btn left" id="btnLeft">◀</div>
    <div class="btn down" id="btnDown">▼</div>
    <div class="btn right" id="btnRight">▶</div>
    <div class="btn gadget" id="btnGadget">🪝<div class="gadgetSweep" id="gadgetSweep"></div></div>
    <div class="btn shoot" id="btnShoot">
      <svg class="crosshairIcon" viewBox="0 0 48 48" width="1em" height="1em">
        <circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="2.6"/>
        <circle cx="24" cy="24" r="4.2" fill="currentColor"/>
        <line x1="24" y1="1.5" x2="24" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="24" y1="36" x2="24" y2="46.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="1.5" y1="24" x2="12" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="36" y1="24" x2="46.5" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="gadgetSweep" id="shootSweep"></div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/gadgets.js"></script>
<script src="js/level.js"></script>
<script src="js/audio-sfx.js"></script>
<script src="js/audio-theme.js"></script>
<script src="js/audio-music.js"></script>
<script src="audio/voice/manifest.js"></script>
<script src="js/voice.js"></script>
<script src="js/gameplay.js"></script>
<script src="js/game.js"></script>
<script src="js/hunt.js"></script>
<script src="js/render-figures.js"></script>
<script src="js/render-world.js"></script>
<script src="js/render-actors.js"></script>
<script src="js/render-overlay.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/input.js"></script>
<script src="js/qr.js"></script>
<script src="js/net.js"></script>
<script src="js/versus-sim.js"></script>
<script src="js/versus-cpu.js"></script>
<script src="js/versus-render.js"></script>
<script src="js/versus.js"></script>
<script src="js/splash.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
